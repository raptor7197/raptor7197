<svg xmlns="http://www.w3.org/2000/svg" width="620" height="142" viewBox="0 0 620 142" fill="none">
  <style>
    .text { fill: #6e7681; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
